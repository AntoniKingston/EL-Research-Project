run_name: main
links_file: data/links.csv
data_dir: data
results_dir: results
device: cuda

master_seed: 42
refit_seeds: [42, 67, 69, 228, 2137]
n_outer_folds: 5

# Names from links_file; empty list = all datasets.
datasets: []

# Optional per-dataset cap on the number of samples: a seeded subsample
# (stratified for classification) drawn with master_seed before the CV splits.
max_samples:
  covertype: 50000

# Stage 2 methods. The single ResNet ("resnet") is always run as Stage 1.
# Available: tangos, batchensemble, ensemble_none, ensemble_symmetric, sfo_cka, sfo_cos
methods:
  - tangos
  - batchensemble
  - ensemble_none
  - ensemble_symmetric
  - sfo_cka
  - sfo_cos

training:
  optimizer: AdamW
  max_epochs: 200
  patience: 16
  # "auto": 256, or 512 for datasets with more than 50k samples.
  batch_size: auto

hpo:
  stage1_trials: 40
  stage2_trials: 30
  # Stage 1 tunes only the backbone architecture; optimization is fixed.
  stage1_lr: 1.0e-3
  stage1_wd: 1.0e-4
  ensemble_size: 8
