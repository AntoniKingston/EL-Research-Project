[project]
name = "EL-Research-project"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "optuna",
    "datasets",
    "diffusers",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "python-dotenv",
    "ruff",
    "scikit-image",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
    "wandb",
    "ty>=0.0.95",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "N",    # pep8-naming
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize code)
    "B",    # bugbear (catch bugs)
    "SIM",  # flake8-simplify (simplify code)
    "NPY",  # NumPy-specific rules
    "RUF",  # Ruff-specific rules
]
ignore = [
    "N803", # Argument name should be lowercase
    "N806", # Variable should be lowercase
    "N812", # Lowercase imported as non-lowercase
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
